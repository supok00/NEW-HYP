<!-- title: 상담문의 — HYP -->
<!-- desc: HYP 무료 상담 신청. 호텔·인력 서비스, 방역 서비스 상담을 남겨 주시면 담당자가 연락드립니다. 대표전화 031-756-0449 -->
<!-- header: solid -->
<section class="section" style="padding-top:calc(var(--header-h) + clamp(56px, 8vw, 104px))">
  <div class="container form-shell">
    <aside class="contact-side">
      <div>
        <p class="eyebrow reveal">Contact</p>
        <h1 class="h2 reveal d1" style="margin-top:16px">무료 상담 신청</h1>
        <p class="lead reveal d2" style="margin-top:20px">필요한 서비스를 선택하고 내용을 남겨 주세요. 담당자가 확인 후 연락드립니다.</p>
      </div>
      <div class="reveal d3">
        <div class="item"><small>Call</small><b><a href="tel:0317560449" class="tnum">031-756-0449</a></b><p>평일 09:00 – 18:00</p></div>
        <div class="item"><small>Head office</small><p>경기도 성남시 수정구 위례광장로 21-9, 1806호<br>(창곡동, 위례우남역KCC웰츠타워)</p></div>
        <div class="item"><small>Brochure</small><a class="btn btn-line" href="HYP.pptx" download>{{icon:download}}회사소개서 다운로드</a></div>
      </div>
    </aside>

    <div class="reveal d1">
      <div class="form-tabs" role="tablist" aria-label="상담 종류">
        <button type="button" role="tab" id="tab-hotel" aria-controls="panel-hotel" aria-selected="true" data-hash="hotel">호텔·인력 서비스</button>
        <button type="button" role="tab" id="tab-dis" aria-controls="panel-dis" aria-selected="false" data-hash="disinfection">방역 서비스</button>
      </div>

      <form class="form-card inquiry" id="panel-hotel" role="tabpanel" aria-labelledby="tab-hotel" novalidate>
        <input type="hidden" name="_subject" value="[HYP] 호텔·인력 서비스 상담 신청">
        <input type="hidden" name="type" value="호텔·인력 서비스">
        <fieldset class="fieldset">
          <legend class="req">상담 분야</legend>
          <div class="chips">
            <input type="radio" name="category" id="h1" value="채용대행" required><label for="h1">채용대행</label>
            <input type="radio" name="category" id="h2" value="헤드헌팅"><label for="h2">헤드헌팅</label>
            <input type="radio" name="category" id="h3" value="아웃소싱"><label for="h3">아웃소싱</label>
            <input type="radio" name="category" id="h4" value="직무교육"><label for="h4">직무교육</label>
            <input type="radio" name="category" id="h5" value="자산관리"><label for="h5">자산관리</label>
          </div>
        </fieldset>
        <div class="fields">
          <div class="field"><label class="lbl req" for="h-name">담당자 이름</label><input id="h-name" name="name" autocomplete="name" required></div>
          <div class="field"><label class="lbl" for="h-company">회사·사업장명</label><input id="h-company" name="company" autocomplete="organization"></div>
          <div class="field"><label class="lbl req" for="h-phone">연락처</label><input id="h-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required></div>
          <div class="field"><label class="lbl" for="h-count">요청 인원</label><input id="h-count" name="headcount" inputmode="numeric" placeholder="예: 20명"></div>
          <div class="field full"><label class="lbl" for="h-addr">현장 주소</label><input id="h-addr" name="address" autocomplete="street-address"></div>
          <div class="field full"><label class="lbl" for="h-msg">문의 내용</label><textarea id="h-msg" name="message" placeholder="객실 수, 필요 업무, 시작 희망일 등을 적어 주시면 더 정확히 안내해 드립니다."></textarea></div>
        </div>
        <label class="agree"><input type="checkbox" name="agree" required> <span>상담을 위한 개인정보(이름, 연락처, 주소) 수집·이용에 동의합니다. 수집한 정보는 상담 목적에만 사용하며 상담 완료 후 파기합니다.</span></label>
        <button class="btn btn-dark" type="submit">상담 신청하기 {{icon:arrow}}</button>
        <p class="form-note">급한 문의는 대표전화 031-756-0449로 연락 주세요.</p>
      </form>

      <form class="form-card inquiry" id="panel-dis" role="tabpanel" aria-labelledby="tab-dis" novalidate hidden>
        <input type="hidden" name="_subject" value="[HYP] 방역 서비스 상담 신청">
        <input type="hidden" name="type" value="방역 서비스">
        <fieldset class="fieldset">
          <legend class="req">고객 구분</legend>
          <div class="chips">
            <input type="radio" name="category" id="d1" value="요식업" required><label for="d1">요식업</label>
            <input type="radio" name="category" id="d2" value="가정집"><label for="d2">가정집</label>
            <input type="radio" name="category" id="d3" value="식품제조업"><label for="d3">식품제조업</label>
            <input type="radio" name="category" id="d4" value="의약제조"><label for="d4">의약제조</label>
            <input type="radio" name="category" id="d5" value="일반제조"><label for="d5">일반제조</label>
            <input type="radio" name="category" id="d6" value="일반건물"><label for="d6">일반건물</label>
            <input type="radio" name="category" id="d7" value="협회회원사"><label for="d7">협회회원사</label>
            <input type="radio" name="category" id="d8" value="기타"><label for="d8">기타</label>
          </div>
        </fieldset>
        <div class="fields">
          <div class="field"><label class="lbl req" for="d-name">이름</label><input id="d-name" name="name" autocomplete="name" required></div>
          <div class="field"><label class="lbl" for="d-company">상호명</label><input id="d-company" name="company" autocomplete="organization"></div>
          <div class="field"><label class="lbl req" for="d-phone">연락처</label><input id="d-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required></div>
          <div class="field"><label class="lbl" for="d-area">면적</label>
            <div class="unit"><input id="d-area" name="area" inputmode="decimal" placeholder="예: 30"><select name="area_unit" aria-label="면적 단위"><option>평</option><option>㎡</option></select></div>
          </div>
          <div class="field full"><label class="lbl" for="d-addr">주소</label><input id="d-addr" name="address" autocomplete="street-address"></div>
          <div class="field full"><label class="lbl" for="d-msg">문의 내용</label><textarea id="d-msg" name="message" placeholder="방역이 필요한 공간, 희망 일정 등을 적어 주세요."></textarea></div>
        </div>
        <label class="agree"><input type="checkbox" name="agree" required> <span>상담을 위한 개인정보(이름, 연락처, 주소) 수집·이용에 동의합니다. 수집한 정보는 상담 목적에만 사용하며 상담 완료 후 파기합니다.</span></label>
        <button class="btn btn-dark" type="submit">상담 신청하기 {{icon:arrow}}</button>
        <p class="form-note">급한 문의는 대표전화 031-756-0449로 연락 주세요.</p>
      </form>
    </div>
  </div>
</section>
